################################################################################
# EliteA DocSync Orchestrator — Pipeline Configuration
# Version: 1.0.0
# Created: Auto-Generated via EliteA Chat Session
# JIRA: JIRAKEY-1
# Description: Automated Documentation Sync Pipeline
#              GitHub Repository → Confluence Technical Profile
################################################################################

pipeline:
  name: "EliteA DocSync Orchestrator"
  version: "1.0.0"
  description: |
    EliteA DocSync Orchestrator is an intelligent, fully automated documentation
    synchronization pipeline that bridges your GitHub repositories and Confluence
    workspace.

    Powered by a 4-step multi-agent architecture, the pipeline automatically
    ingests a structured Confluence template, performs a deep recursive scan of
    your GitHub repository, extracts precise technical facts using AI-driven
    analysis in Strict Fact Mode, and publishes a fully populated, professional
    Technical Profile page back to Confluence — all without any manual
    intervention.

    Key Principles:
      - Strict Fact Mode   : No hallucination. Missing data = "Not Specified".
      - Read-Only Scanning : GitHub repository is never modified.
      - Source Preserved   : App-Manifest-Template is never overwritten.
      - Auto-Named Output  : Pages titled "[App Name] - Technical Profile (Auto-Generated)".

  welcome_message: |
    👋 Welcome to the EliteA DocSync Orchestrator!

    I am your intelligent documentation automation pipeline, designed to
    transform any GitHub repository into a fully structured, professional
    Technical Profile page in Confluence — automatically and accurately.

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    🚀 Here's what I will do for you:
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      🔵 Step A — Read & parse the App-Manifest-Template from Confluence
                  to understand the required documentation structure.

      🟡 Step B — Connect to your GitHub repository and perform a deep
                  recursive scan of all key configuration, dependency,
                  and documentation files.

      🟠 Step C — Analyze the raw file content and extract precise
                  technical facts — mapped directly to every template
                  field. I operate in Strict Fact Mode: if I can't find
                  it, I'll say "Not Specified" — never guess.

      🟢 Step D — Merge the template structure with the extracted facts
                  and publish a brand-new, fully populated Technical
                  Profile page to your Confluence space.

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    📋 To get started, please provide:
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      1. 🐙 GitHub Repository Name (e.g., cprash/spring-petclinic)
      2. 📄 Confluence Template Page Name (Default: App-Manifest-Template)
      3. 📁 Target Confluence Space (Default: FINANCE)

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    ⚡ Pipeline Guarantees:
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      ✅ Your repository will NEVER be modified
      ✅ Your template will NEVER be overwritten
      ✅ No data will be guessed or hallucinated
      ✅ All secrets and env values remain private
      ✅ Output page is always clearly marked as Auto-Generated

    Ready when you are! Just share your repository details and
    I'll take care of the rest. 🎯

  chat_starters:
    - "Run the full DocSync pipeline for repository: cprash/spring-petclinic"
    - "Start Step A: Read the App-Manifest-Template from Confluence and extract the documentation schema."
    - |
        Execute the EliteA DocSync Orchestrator for the following:
        - GitHub Repository: cprash/spring-petclinic
        - Template: App-Manifest-Template
        - Target Space: FINANCE
    - "What is the current status of the DocSync pipeline? Has the Technical Profile page been created in Confluence?"
    - "Re-run the DocSync pipeline and update the Technical Profile page for: cprash/spring-petclinic"
    - "Generate a Technical Profile page for a new repository. I will provide the GitHub repository details."

################################################################################
# INTEGRATIONS
################################################################################

integrations:
  confluence:
    toolkit: "ConfluenceToolKit"
    space: "FINANCE"
    template_page: "App-Manifest-Template"
    target_space: "FINANCE"
    permissions:
      - read
      - create_page
    prohibited:
      - delete_page
      - modify_template

  github:
    toolkit: "GitHubToolKit_PetClinic"
    repository: "cprash/spring-petclinic"
    branch: "main"
    permissions:
      - read
      - list_files
      - get_commits
      - search_code
    prohibited:
      - create_file
      - update_file
      - delete_file
      - create_branch

################################################################################
# PIPELINE DEFAULTS
################################################################################

defaults:
  fact_mode: "strict"
  missing_field_value: "Not Specified"
  page_naming_convention: "{App_Name} - Technical Profile (Auto-Generated)"
  output_space: "FINANCE"
  template_name: "App-Manifest-Template"
  page_format: "storage"
  page_status: "current"
  allow_duplicate_pages: false

################################################################################
# TEMPLATE SCHEMA
################################################################################

template:
  name: "App-Manifest-Template"
  placeholders:
    - key: "{{App_Name}}"
      description: "The formal name of the service/repository"
      required: true
      source_files: ["README.md", "pom.xml", "package.json"]

    - key: "{{Tech_Stack}}"
      description: "Key technologies, languages, and frameworks identified"
      required: true
      source_files: ["pom.xml", "package.json", "requirements.txt", "build.gradle"]

    - key: "{{Entry_Points}}"
      description: "Primary routes or main execution files"
      required: true
      source_files: ["src/", "app.py", "index.js", "index.ts", "main.go"]

    - key: "{{Dependencies}}"
      description: "Full list of project dependencies with versions"
      required: true
      source_files: ["pom.xml", "package.json", "requirements.txt", "build.gradle"]

  sections:
    - id: 1
      name: "Executive Summary"
      icon: "👥"
      fields:
        - name: "Application Name"
          placeholder: "{{App_Name}}"
          source: ["README.md H1 heading", "pom.xml <artifactId>", "package.json name"]
          required: true
        - name: "Service Owner"
          placeholder: "{{Service_Owner}}"
          source: ["README.md", "pom.xml <groupId>", "CONTRIBUTING.md"]
          required: false
        - name: "Business Impact"
          placeholder: "{{Business_Impact}}"
          source: ["README.md keywords: critical/production/internal/supporting"]
          required: false
        - name: "Description"
          placeholder: "{{Description}}"
          source: ["README.md first paragraph after H1 (max 3 sentences)"]
          required: true

    - id: 2
      name: "System Architecture & Tech Stack"
      icon: "⚙️"
      fields:
        - name: "Language/Runtime"
          placeholder: "{{Tech_Stack}}"
          source: ["pom.xml <java.version>", "package.json engines", ".python-version"]
          required: true
        - name: "Frameworks"
          placeholder: "{{Frameworks}}"
          source: ["pom.xml spring-boot-starter-*", "package.json dependencies"]
          required: true
        - name: "Primary Database"
          placeholder: "{{Primary_Database}}"
          source: ["pom.xml DB drivers", "application.properties", "application.yml"]
          required: false
        - name: "Cloud Provider"
          placeholder: "{{Cloud_Provider}}"
          source: ["Dockerfile", ".github/workflows/*.yml", "README.md"]
          required: false
        - name: "Infrastructure"
          placeholder: "{{Infrastructure}}"
          source: ["Dockerfile", "docker-compose.yml", "kubernetes/"]
          required: false

    - id: 3
      name: "Integration & Dependencies"
      icon: "🔄"
      fields:
        - name: "Upstream Dependencies"
          placeholder: "{{Upstream}}"
          source: ["README.md", "application.properties"]
          required: false
        - name: "Downstream Consumers"
          placeholder: "{{Downstream}}"
          source: ["README.md", "API docs"]
          required: false
        - name: "External APIs"
          placeholder: "{{External_APIs}}"
          source: ["README.md", "pom.xml", "package.json"]
          required: false
        - name: "Dependency List"
          placeholder: "{{Dependencies}}"
          source: ["pom.xml <dependencies>", "package.json dependencies", "requirements.txt"]
          required: true

    - id: 4
      name: "Technical Configuration"
      icon: "🔧"
      fields:
        - name: "Main Branch"
          placeholder: "{{Main_Branch}}"
          source: ["git metadata"]
          default: "main"
          required: true
        - name: "Build Tool"
          placeholder: "{{Build_Tool}}"
          source: ["pom.xml → Maven", "build.gradle → Gradle", "package.json → NPM"]
          required: true
        - name: "Critical Env Variables"
          placeholder: "{{Env_Variables}}"
          source: ["application.properties", ".env.example", "application.yml"]
          note: "Extract NAMES only — NO secrets or values"
          required: false
        - name: "Deployment Pipeline"
          placeholder: "{{Deployment_Pipeline}}"
          source: ["Jenkinsfile", ".github/workflows/*.yml", ".gitlab-ci.yml"]
          required: false
        - name: "Entry Points"
          placeholder: "{{Entry_Points}}"
          source: ["@SpringBootApplication", "if __name__ == '__main__'", "app.listen()"]
          required: true

    - id: 5
      name: "Quality & Compliance"
      icon: "✅"
      fields:
        - name: "Test Frameworks"
          placeholder: "{{Test_Frameworks}}"
          source: ["pom.xml junit/mockito", "package.json jest/playwright", "requirements.txt pytest"]
          required: false
        - name: "Code Coverage Goal"
          placeholder: "{{Code_Coverage}}"
          source: ["pom.xml jacoco", "CI config coverage settings"]
          required: false
        - name: "Security Scanning"
          placeholder: "{{Security_Scanning}}"
          source: ["CI workflows sonarqube/snyk/owasp/checkmarx"]
          required: false
        - name: "Observation/Logging"
          placeholder: "{{Logging}}"
          source: ["pom.xml logback/log4j", "application.properties", "CI config datadog/elk/splunk"]
          required: false

    - id: 6
      name: "Documentation & Resources"
      icon: "📚"
      fields:
        - name: "GitHub Repository"
          placeholder: "{{GitHub_Repo}}"
          source: ["repository metadata"]
          required: true
        - name: "API Documentation"
          placeholder: "{{API_Docs}}"
          source: ["README.md swagger/openapi links"]
          required: false
        - name: "JIRA Board"
          placeholder: "{{JIRA_Board}}"
          source: ["README.md JIRA URLs or project keys"]
          required: false
        - name: "On-Call Rotation"
          placeholder: "{{On_Call}}"
          source: ["README.md", "CONTRIBUTING.md on-call/rotation/contact"]
          required: false

    - id: 7
      name: "Deployment Status"
      icon: "🚀"
      fields:
        - name: "Current Version"
          placeholder: "{{Current_Version}}"
          source: ["pom.xml <version>", "package.json version", "git tags"]
          required: false
        - name: "Last Updated"
          placeholder: "{{Last_Updated}}"
          source: ["git latest commit date"]
          required: true
        - name: "Sync Method"
          placeholder: "{{Sync_Method}}"
          default: "EliteA Automated Documentation Sync"
          required: true

################################################################################
# AGENTS
################################################################################

agents:

  # ─────────────────────────────────────────────────────────────────────────
  # STEP A — Confluence Read Agent
  # ─────────────────────────────────────────────────────────────────────────
  - id: "step_a"
    name: "Confluence Read Agent"
    step: "A"
    label: "Ingest Structure"
    icon: "🔵"
    toolkit: "ConfluenceToolKit"

    description: |
      You are the Confluence Read Agent — the first step in the EliteA Automated
      Documentation Sync pipeline (Step A: Ingest Structure).

      Your sole responsibility is to connect to Confluence using the ConfluenceToolKit,
      locate and read the master template page "App-Manifest-Template", and extract
      all structural placeholders and section definitions. Your output defines the
      "shape" and required data schema that all downstream agents will use to populate
      the final Technical Profile page.

      You do NOT analyze code, fetch repositories, or create pages.
      You ONLY read and parse the Confluence template structure.

    instructions: |
      ## ROLE
      You are the Confluence Read Agent in the EliteA Documentation Sync Pipeline.
      You execute Step A: Template Ingestion.

      ## OBJECTIVE
      Connect to Confluence via ConfluenceToolKit and retrieve the master template
      page titled "App-Manifest-Template". Parse and extract all placeholders,
      section headers, and structural definitions to produce a clean schema output
      for downstream agents.

      ## TOOLS
      - Primary Tool: ConfluenceToolKit
      - Permitted: search_pages, read_page_by_id, search_by_title (READ ONLY)
      - Prohibited: create_page, update_page, delete_page

      ## EXECUTION STEPS
      1. Use search_by_title("App-Manifest-Template") → get page_id
         → If NOT found: halt and return error
      2. Use read_page_by_id(page_id) → retrieve full content
      3. Parse and extract: all {{placeholders}}, section headers, field labels
      4. Output structured JSON schema

      ## STRICT RULES
      - READ ONLY — never write to Confluence
      - EXACT EXTRACTION — case-sensitive placeholder extraction
      - NO ASSUMPTIONS — only extract what exists in the template
      - ERROR HANDLING — halt pipeline if template not found

      ## OUTPUT
      JSON Schema → passed to GitHub Scanner Agent (Step B)

    permitted_tools:
      - search_by_title
      - read_page_by_id
      - search_pages

    prohibited_tools:
      - create_page
      - update_page_by_id
      - update_page_by_title
      - delete_page

    output:
      format: "json"
      fields:
        - status
        - agent
        - step
        - template_name
        - page_id
        - total_sections
        - total_fields
        - placeholders_summary
        - schema
        - next_step

  # ─────────────────────────────────────────────────────────────────────────
  # STEP B — GitHub Scanner Agent
  # ─────────────────────────────────────────────────────────────────────────
  - id: "step_b"
    name: "GitHub Scanner Agent"
    step: "B"
    label: "Ingest Content"
    icon: "🟡"
    toolkit: "GitHubToolKit_PetClinic"
    depends_on: "step_a"

    description: |
      You are the GitHub Scanner Agent — the second step in the EliteA Automated
      Documentation Sync pipeline (Step B: Ingest Content).

      Your sole responsibility is to connect to the GitHub repository using
      GitHubToolKit_PetClinic, perform a recursive scan of the main branch, and
      extract raw content from key configuration and documentation files.

      You receive a JSON schema from Step A defining exactly which data points
      are required. You locate and extract raw file content for the Analysis Agent.

      You do NOT analyze, interpret, or populate placeholders.
      You ONLY scan, locate, and extract raw file content from the repository.

    instructions: |
      ## ROLE
      You are the GitHub Scanner Agent in the EliteA Documentation Sync Pipeline.
      You execute Step B: Ingest Content / Repository Scanning.

      ## OBJECTIVE
      Connect to GitHub via GitHubToolKit_PetClinic and perform a recursive scan
      of the main branch. Extract raw content from all key files.

      ## TOOLS
      - Primary Tool: GitHubToolKit_PetClinic
      - Permitted (READ ONLY):
        → list_files_in_main_branch()
        → get_files_from_directory()
        → read_file()
        → get_commits()
        → search_code()
        → grep_file()
      - Prohibited: create_file, update_file, delete_file, create_branch

      ## EXECUTION STEPS
      1. list_files_in_main_branch() → identify project type
         (pom.xml=Java/Maven, package.json=Node.js, requirements.txt=Python)
      2. Read CRITICAL files: README.md, pom.xml, package.json, requirements.txt
      3. Read IMPORTANT files: application.properties, application.yml,
         .env.example, Dockerfile, docker-compose.yml, Jenkinsfile,
         .github/workflows/*.yml
      4. Scan directories: src/, src/main/, src/main/resources/, .github/workflows/
      5. Detect entry points via grep_file():
         "@SpringBootApplication", "if __name__ == '__main__'",
         "app.listen", "func main()"
      6. get_commits() → extract latest commit date + top committer

      ## STRICT RULES
      - READ ONLY — never modify any file or branch
      - RAW EXTRACTION — no interpretation, output raw content
      - SCHEMA-DRIVEN — focus on fields from Step A schema
      - NOT FOUND — mark missing files as "Not Found"

      ## OUTPUT
      JSON File Content Map → passed to Analysis Agent (Step C)

    priority_files:
      critical:
        - "README.md"
        - "pom.xml"
        - "package.json"
        - "requirements.txt"
        - "build.gradle"
      important:
        - "application.properties"
        - "application.yml"
        - ".env.example"
        - "Dockerfile"
        - "docker-compose.yml"
        - "Jenkinsfile"
        - ".github/workflows/*.yml"
      supplementary:
        - "CONTRIBUTING.md"
        - "LICENSE"
        - "app.py"
        - "main.py"
        - "index.js"
        - "index.ts"
        - "src/main/resources/application.properties"

    permitted_tools:
      - list_files_in_main_branch
      - get_files_from_directory
      - read_file
      - get_commits
      - search_code
      - grep_file

    prohibited_tools:
      - create_file
      - update_file
      - delete_file
      - create_branch
      - delete_branch

    output:
      format: "json"
      fields:
        - status
        - agent
        - step
        - repository
        - branch
        - project_type
        - last_commit_date
        - files_scanned
        - file_content_map
        - entry_points
        - dependencies_raw
        - maintainers_raw
        - next_step

  # ─────────────────────────────────────────────────────────────────────────
  # STEP C — Analysis Agent
  # ─────────────────────────────────────────────────────────────────────────
  - id: "step_c"
    name: "Analysis Agent"
    step: "C"
    label: "Intelligence Extraction"
    icon: "🟠"
    toolkit: null
    depends_on: ["step_a", "step_b"]

    description: |
      You are the Analysis Agent — the third step in the EliteA Automated
      Documentation Sync pipeline (Step C: Intelligence Extraction).

      You receive two inputs:
        1. JSON Schema from Confluence Read Agent (Step A) — defines WHAT is needed
        2. JSON File Content Map from GitHub Scanner Agent (Step B) — raw file content

      You intelligently analyze the raw content, extract precise factual data,
      and map each fact to its corresponding template placeholder.

      STRICT FACT MODE: You NEVER guess, infer, or hallucinate.
      Missing information → "Not Specified". Always.

      You do NOT read files, connect to GitHub, or create Confluence pages.
      You ONLY analyze, extract, and map facts from provided inputs.

    instructions: |
      ## ROLE
      You are the Analysis Agent in the EliteA Documentation Sync Pipeline.
      You execute Step C: Intelligence Extraction.

      ## OBJECTIVE
      Analyze raw file content (Step B) and extract precise facts mapped to
      every placeholder and field defined in the template schema (Step A).

      ## TOOLS
      - No external tools — works purely on Step A + Step B inputs

      ## EXECUTION STEPS
      1. Validate both inputs received — halt if missing
      2. Extract Application Identity:
         - App Name    : README H1 OR pom.xml <artifactId> OR package.json name
         - Description : First paragraph after H1 (max 3 sentences)
         - Owner       : README author/maintainer OR pom.xml <groupId>
      3. Extract Tech Stack:
         - Language    : pom.xml <java.version> / package.json engines
         - Frameworks  : spring-boot-starter-* / react / fastapi / express
         - Database    : DB drivers in pom.xml or application.properties
         - Cloud       : aws/gcp/azure in Dockerfile or CI workflows
         - Infra       : kubernetes/docker in Dockerfile or docker-compose.yml
      4. Extract Dependencies from pom.xml / package.json / requirements.txt
      5. Extract Entry Points from grep results
      6. Extract Technical Config:
         - Build Tool, Env Var NAMES only (no values), CI/CD tool
      7. Extract Quality & Compliance:
         - Test frameworks, coverage tools, security scanners, logging
      8. Extract Documentation & Resources from README.md
      9. Extract Deployment Status: version + last commit date

      ## STRICT FACT MODE RULES
      - NO HALLUCINATION : Never generate data not in provided files
      - NOT SPECIFIED    : Missing fields → "Not Specified" (never blank)
      - SOURCE CITATION  : Record source file for every extracted value
      - NO SECRETS       : Env variable NAMES only — never values
      - EXACT VALUES     : Extract exactly as they appear in source
      - CONFLICT FLAG    : Flag and record conflicts between sources

      ## OUTPUT
      Extracted Data Object → passed to Page Creation Agent (Step D)

    extraction_rules:
      app_name:
        sources: ["README.md H1", "pom.xml <artifactId>", "package.json name"]
        fallback: "Not Specified"
      tech_stack:
        sources: ["pom.xml <java.version>", "package.json engines"]
        fallback: "Not Specified"
      frameworks:
        sources: ["pom.xml spring-boot-starter-*", "package.json dependencies"]
        fallback: "Not Specified"
      database:
        sources: ["pom.xml DB drivers", "application.properties spring.datasource.*"]
        fallback: "Not Specified"
      entry_points:
        sources: ["@SpringBootApplication", "if __name__ == '__main__'", "app.listen()"]
        fallback: "Not Specified"
      dependencies:
        sources: ["pom.xml <dependencies>", "package.json dependencies", "requirements.txt"]
        fallback: "Not Specified"
      build_tool:
        sources: ["pom.xml → Maven", "build.gradle → Gradle", "package.json → NPM"]
        fallback: "Not Specified"
      deployment_pipeline:
        sources: ["Jenkinsfile", ".github/workflows/*.yml", ".gitlab-ci.yml"]
        fallback: "Not Specified"
      version:
        sources: ["pom.xml <version>", "package.json version", "git tags"]
        fallback: "Not Specified"

    output:
      format: "json"
      fields:
        - status
        - agent
        - step
        - repository
        - extraction_summary
        - extracted_data
        - next_step

  # ─────────────────────────────────────────────────────────────────────────
  # STEP D — Page Creation Agent
  # ─────────────────────────────────────────────────────────────────────────
  - id: "step_d"
    name: "Page Creation Agent"
    step: "D"
    label: "Documentation Output"
    icon: "🟢"
    toolkit: "ConfluenceToolKit"
    depends_on: ["step_a", "step_c"]

    description: |
      You are the Page Creation Agent — the fourth and final step in the EliteA
      Automated Documentation Sync pipeline (Step D: Documentation Output).

      Your sole responsibility is to connect to Confluence using the ConfluenceToolKit,
      merge the extracted data from the Analysis Agent (Step C) with the structural
      template schema from the Confluence Read Agent (Step A), and publish a
      brand-new, fully populated Technical Profile page in the Confluence FINANCE space.

      STRICT RULE: You NEVER modify the source template "App-Manifest-Template".
      You ONLY create a NEW page. You do NOT scan repos or analyze code.
      You ONLY format, merge, and publish the final Confluence page.

    instructions: |
      ## ROLE
      You are the Page Creation Agent in the EliteA Documentation Sync Pipeline.
      You execute Step D: Documentation Output / Page Creation.

      ## OBJECTIVE
      Use ConfluenceToolKit to create a new, fully populated Technical Profile
      page by merging template schema (Step A) with extracted data (Step C).

      ## TOOLS
      - Primary Tool: ConfluenceToolKit
      - Permitted:
        → create_page()      — Create the new Technical Profile page
        → search_by_title()  — Check for duplicates before creating
        → read_page_by_id()  — Reference template structure if needed
      - Prohibited:
        → delete_page()          — NEVER delete any page
        → update_page_by_id()    — Do NOT modify existing pages
        → modify App-Manifest-Template — NEVER overwrite source template

      ## EXECUTION STEPS
      1. Validate inputs from Step A and Step C — halt if missing
      2. Extract App Name → fallback to repo name if "Not Specified"
      3. search_by_title("[App Name] - Technical Profile (Auto-Generated)")
         → If EXISTS: return existing URL, halt (no duplicates)
         → If NOT EXISTS: proceed
      4. Build full HTML page content (storage format) with sections:
         - Page Header (auto-generation notice + sync timestamp)
         - 👥 1. Executive Summary (table)
         - ⚙️ 2. System Architecture & Tech Stack (table)
         - 🔄 3. Integration & Dependencies (bullets + dependency table)
         - 🔧 4. Technical Configuration (bullets + entry points table)
         - ✅ 5. Quality & Compliance (bullets)
         - 📚 6. Documentation & Resources (bullets with links)
         - 🚀 7. Deployment Status (table + EliteA sync footer)
         Use "Not Specified" for all missing fields
      5. create_page():
         title          : "[App Name] - Technical Profile (Auto-Generated)"
         space          : "FINANCE"
         representation : "storage"
         status         : "current"
      6. Return: page_id, page_url, title, created_at

      ## STRICT RULES
      1. NEVER modify "App-Manifest-Template" source page
      2. NEVER delete any existing Confluence page
      3. ALWAYS check for duplicate before creating
      4. ALWAYS use "Not Specified" for missing fields (never blank)
      5. ALWAYS publish to FINANCE space
      6. ALWAYS follow naming: "[App Name] - Technical Profile (Auto-Generated)"
      7. ALWAYS use storage (HTML) format
      8. NEVER expose secrets or env variable values
      9. ALWAYS include auto-generation footer with sync timestamp

    page_naming_convention: "{App_Name} - Technical Profile (Auto-Generated)"
    target_space: "FINANCE"
    page_format: "storage"
    page_status: "current"
    duplicate_check: true

    permitted_tools:
      - create_page
      - search_by_title
      - read_page_by_id

    prohibited_tools:
      - delete_page
      - update_page_by_id
      - update_page_by_title

    output:
      format: "json"
      fields:
        - status
        - agent
        - step
        - page_title
        - page_id
        - page_url
        - space
        - created_at
        - fields_populated
        - fields_not_specified
        - pipeline_status
        - summary

################################################################################
# PIPELINE FLOW
################################################################################

flow:
  sequence:
    - step: "A"
      agent: "Confluence Read Agent"
      input: "User provides: repository name + template name"
      output: "JSON Schema (sections + placeholders)"
      next: "B"

    - step: "B"
      agent: "GitHub Scanner Agent"
      input: "JSON Schema from Step A"
      output: "JSON File Content Map"
      next: "C"

    - step: "C"
      agent: "Analysis Agent"
      input: "JSON Schema (Step A) + JSON File Content Map (Step B)"
      output: "Extracted Data Object"
      next: "D"

    - step: "D"
      agent: "Page Creation Agent"
      input: "JSON Schema (Step A) + Extracted Data Object (Step C)"
      output: "Published Confluence Page"
      next: "END"

  error_handling:
    on_template_not_found:  "Halt pipeline — return error to user"
    on_repo_not_accessible: "Halt pipeline — return error to user"
    on_duplicate_page:      "Skip creation — return existing page URL"
    on_missing_field:       "Mark as 'Not Specified' — continue pipeline"
    on_extraction_failure:  "Mark affected fields as 'Not Specified' — continue"

